<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3D 粒子爱心烟花秀 · 七夕</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif;cursor:crosshair;}
  canvas{display:block;background:#000;}
  .tip{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#ff69b4;
       font-size:14px;letter-spacing:1px;text-shadow:0 0 10px #ff69b4;z-index:10;pointer-events:none;}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
       color:#ff5b8a;font:16px/1.6 monospace;padding:20px;text-align:center;white-space:pre-wrap;z-index:20;}
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<div class="tip">3D 粒子爱心 · 自动旋转 · 点击屏幕绽放星火与爱心</div>
<div id="err"></div>
<script>
window.onerror=function(m){var e=document.getElementById('err');e.style.display='flex';e.textContent='出错了：'+m;};
(function(){
  const canvas=document.getElementById('heartCanvas');
  const ctx=canvas.getContext('2d');
  let DPR=1, WIDTH=800, HEIGHT=600;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    WIDTH=canvas.width=innerWidth*DPR; HEIGHT=canvas.height=innerHeight*DPR;
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
  }
  addEventListener('resize',resize); resize();

  const PINK=[255,105,180], LIGHT_PINK=[255,182,193], HOT_PINK=[255,20,147];
  const GALAXY=[[180,200,255],[120,160,255],[255,255,255],[200,120,255]];
  const STAR=[[255,255,255],[255,255,180],[180,255,255],[255,180,255],[180,255,180]];

  let angleY=0, pulse=0, lastTime=0;
  const keys={};

  function isIn3DHeart(x,y,z){
    const s=0.7; x/=s; y/=s; z/=s;
    const t=(x*x+(9*y*y)/4+z*z-1);
    return t*t*t - x*x*z*z*z - (9*y*y*z*z*z)/80 <= 0;
  }
  function choice(arr,w){
    if(!w) return arr[Math.floor(Math.random()*arr.length)];
    let tot=w.reduce((a,b)=>a+b,0), r=Math.random()*tot;
    for(let i=0;i<arr.length;i++){r-=w[i]; if(r<=0)return arr[i];}
    return arr[arr.length-1];
  }

  class Particle{
    constructor(){this.reset();}
    reset(){
      let x,y,z;
      do{x=Math.random()*3-1.5;y=Math.random()*3-1.5;z=Math.random()*3-1.5;}while(!isIn3DHeart(x,y,z));
      this.x=x*12;this.y=y*12;this.z=z*12;
      this.dx=(Math.random()-0.5)*0.04;this.dy=(Math.random()-0.5)*0.04;this.dz=(Math.random()-0.5)*0.04;
      this.c=choice([PINK,LIGHT_PINK,HOT_PINK],[0.5,0.3,0.2]);
      this.sz=Math.random()*1.7+1.5;
    }
    draw(ay,ps){
      this.x+=this.dx;this.y+=this.dy;this.z+=this.dz;
      if(!isIn3DHeart(this.x/12,this.y/12,this.z/12))this.reset();
      const xr=this.x*Math.cos(ay)+this.z*Math.sin(ay);
      const zr=-this.x*Math.sin(ay)+this.z*Math.cos(ay);
      const yr=this.y;
      const scale=25*DPR*ps, dist=20;
      const px=WIDTH/2+xr*scale, py=HEIGHT/2-yr*scale;
      const depth=(zr+dist)/(2*dist);
      const cs=Math.max(2*DPR,this.sz*depth*1.5*DPR);
      const f=Math.min(1,Math.max(0.35,depth*1.6));
      const r=Math.min(255,Math.max(0,this.c[0]*f));
      const g=Math.min(255,Math.max(0,this.c[1]*f));
      const b=Math.min(255,Math.max(0,this.c[2]*f));
      if(px<0||px>=WIDTH||py<0||py>=HEIGHT)return;
      ctx.globalAlpha=0.3+0.7*depth;
      ctx.fillStyle='rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
      ctx.beginPath();ctx.arc(px,py,cs,0,6.283);ctx.fill();
    }
  }

  class GalaxyParticle{
    constructor(){
      this.x=Math.random()*WIDTH;this.y=Math.random()*HEIGHT;this.z=Math.random()*60-30;
      this.size=(Math.random()*2+1)*DPR;this.c=choice(GALAXY);
      this.a=Math.random()*208+12;this.alpha=this.a;this.sp=Math.random()+0.5;
      this.ang=Math.random()*0.4-0.2;this.life=Math.random()*60+60;this.fs=Math.random()*0.02+0.01;
    }
    update(){this.y-=this.sp;this.x+=Math.sin(this.ang)*0.5;this.size=Math.max(0,this.size-this.fs);this.life--;if(this.life<30)this.alpha=this.alpha*this.life/30;return this.life>0&&this.y>0&&this.size>0;}
    draw(){ctx.globalAlpha=this.alpha/255;ctx.fillStyle='rgb('+this.c[0]+','+this.c[1]+','+this.c[2]+')';ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,6.283);ctx.fill();}
  }

  class ParticleDrop{
    constructor(src,ay,p){
      const r=src[Math.floor(Math.random()*src.length)].project(ay,p);
      this.x=r.x+(Math.random()-0.5)*160;this.y=r.y+50;this.c=r.c;
      this.size=(Math.random()*1.5+1.5)*DPR;this.sp=Math.random()*2+1;
      this.a=Math.random()*75+180;this.fs=Math.random()*1.5+1;this.hx=(Math.random()-0.5);this.trail=[];
    }
    update(){this.y+=this.sp;this.x+=this.hx;this.a=Math.max(0,this.a-this.fs);
      this.trail.push({x:this.x,y:this.y,s:this.size,a:this.a});if(this.trail.length>5)this.trail.shift();
      return this.a>0&&this.y<HEIGHT+20;}
    draw(){this.trail.forEach((p,i)=>{const fa=p.a*(i+1)/this.trail.length,fs=Math.max(1,p.s*(i+1)/this.trail.length);
      ctx.globalAlpha=fa/255;ctx.fillStyle='rgb('+(this.c[0]|0)+','+(this.c[1]|0)+','+(this.c[2]|0)+')';ctx.beginPath();ctx.arc(p.x,p.y,fs,0,6.283);ctx.fill();});
      ctx.globalAlpha=this.a/255;ctx.fillStyle='rgb('+(this.c[0]|0)+','+(this.c[1]|0)+','+(this.c[2]|0)+')';ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,6.283);ctx.fill();}
  }

  class FallingHeart{
    constructor(){this.reset();}
    reset(){this.x=Math.random()*(WIDTH+200)-100;this.y=-20;this.vx=(Math.random()-0.7)*2;this.vy=Math.random()*3+2;
      this.size=(Math.random()*12+8)*DPR;this.c=choice([PINK,LIGHT_PINK,HOT_PINK],[0.4,0.4,0.2]);
      this.rot=Math.random()*6.28;this.rs=(Math.random()-0.5)*0.1;this.a=Math.random()*0.8+0.2;
      this.trail=[];this.life=Math.random()*200+300;this.tw=Math.random()*6.28;}
    update(){this.x+=this.vx;this.y+=this.vy;this.rot+=this.rs;this.tw+=0.15;this.life--;
      this.trail.push({x:this.x,y:this.y,s:this.size*0.6,a:this.a*0.3});if(this.trail.length>8)this.trail.shift();
      if(this.y>HEIGHT+50||this.x<-100||this.x>WIDTH+100||this.life<=0)this.reset();return true;}
    draw(){
      this.trail.forEach((p,i)=>{const ta=p.a*(i+1)/this.trail.length,ts=p.s*(i+1)/this.trail.length;
        ctx.globalAlpha=ta;ctx.save();ctx.translate(p.x,p.y);ctx.scale(ts/10,ts/10);ctx.fillStyle='rgb('+this.c[0]+','+this.c[1]+','+this.c[2]+')';
        heartPath(ctx);ctx.fill();ctx.restore();});
      const tw=0.8+0.2*Math.sin(this.tw);
      ctx.globalAlpha=this.a*tw;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.scale(this.size/10,this.size/10);
      ctx.fillStyle='rgb('+this.c[0]+','+this.c[1]+','+this.c[2]+')';heartPath(ctx);ctx.fill();ctx.restore();
    }
  }

  class ClickStar{
    constructor(x,y){this.x=x+(Math.random()-0.5)*100;this.y=y+(Math.random()-0.5)*100;this.vx=(Math.random()-0.5)*8;this.vy=(Math.random()-0.5)*8-Math.random()*3;
      this.size=(Math.random()*4+2)*DPR;this.c=choice(STAR);this.life=Math.random()*60+120;this.ml=this.life;this.rot=Math.random()*6.28;this.rs=(Math.random()-0.5)*0.2;this.tw=Math.random()*6.28;}
    update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.1;this.vx*=0.99;this.life--;this.rot+=this.rs;this.tw+=0.2;return this.life>0;}
    draw(){const al=this.life/this.ml, ta=al*(0.7+0.3*Math.sin(this.tw));
      ctx.globalAlpha=ta;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle='rgb('+this.c[0]+','+this.c[1]+','+this.c[2]+')';
      ctx.beginPath();for(let i=0;i<5;i++){const a=i*6.283/5-1.57,x=Math.cos(a)*this.size,y=Math.sin(a)*this.size;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        const ia=((i+0.5)*6.283)/5-1.57,ix=Math.cos(ia)*this.size*0.4,iy=Math.sin(ia)*this.size*0.4;ctx.lineTo(ix,iy);}ctx.closePath();ctx.fill();ctx.restore();}
  }

  class ClickHeart{
    constructor(x,y){this.x=x+(Math.random()-0.5)*50;this.y=y+(Math.random()-0.5)*50;this.vx=(Math.random()-0.5)*6;this.vy=-Math.random()*8-2;
      this.size=(Math.random()*8+6)*DPR;this.c=choice([PINK,LIGHT_PINK,HOT_PINK]);this.life=Math.random()*40+80;this.ml=this.life;this.rot=Math.random()*6.28;this.rs=(Math.random()-0.5)*0.1;}
    update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.15;this.vx*=0.98;this.life--;this.rot+=this.rs;return this.life>0;}
    draw(){const al=this.life/this.ml;ctx.globalAlpha=al;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.scale(this.size/10,this.size/10);
      ctx.fillStyle='rgb('+this.c[0]+','+this.c[1]+','+this.c[2]+')';heartPath(ctx);ctx.fill();ctx.restore();}
  }

  function heartPath(c){
    c.beginPath();c.moveTo(0,3);c.bezierCurveTo(-5,-2,-10,1,-5,6);c.bezierCurveTo(-3,8,0,10,0,10);
    c.bezierCurveTo(0,10,3,8,5,6);c.bezierCurveTo(10,1,5,-2,0,3);c.closePath();
  }

  // patch Particle to expose projection for drops
  Particle.prototype.project=function(ay,ps){
    const xr=this.x*Math.cos(ay)+this.z*Math.sin(ay);
    const zr=-this.x*Math.sin(ay)+this.z*Math.cos(ay);
    const scale=25*DPR*ps;
    return {x:WIDTH/2+xr*scale,y:HEIGHT/2-this.y*scale,c:this.c};
  };

  const particles=[]; for(let i=0;i<2600;i++)particles.push(new Particle());
  let galaxy=[],drops=[],stars=[],hearts=[],falling=[];
  for(let i=0;i<15;i++)falling.push(new FallingHeart());

  addEventListener('keydown',e=>{keys[e.code]=true;});
  addEventListener('keyup',e=>{keys[e.code]=false;});
  canvas.addEventListener('click',e=>{
    const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*DPR,y=(e.clientY-r.top)*DPR;
    for(let i=0;i<15;i++)stars.push(new ClickStar(x,y));
    for(let i=0;i<8;i++)hearts.push(new ClickHeart(x,y));
  });

  function frame(now){
    const dt=now-lastTime;lastTime=now;
    if(keys['ArrowLeft'])angleY-=0.05; if(keys['ArrowRight'])angleY+=0.05;
    angleY+=0.01;
    const t=now*0.001;
    pulse=0.85+Math.sin(t*4)*0.15+Math.sin(t*8)*0.05+Math.sin(t*1.5)*0.1;

    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#000';ctx.fillRect(0,0,WIDTH,HEIGHT);

    if(Math.random()<0.6)galaxy.push(new GalaxyParticle());
    if(drops.length<300&&Math.random()<0.95)drops.push(new ParticleDrop(particles,angleY,pulse));

    galaxy=galaxy.filter(p=>p.update());galaxy.forEach(p=>p.draw(ctx));
    drops=drops.filter(p=>p.update());drops.forEach(p=>p.draw(ctx));
    falling.forEach(h=>{h.update();h.draw(ctx);});
    stars=stars.filter(s=>s.update());stars.forEach(s=>s.draw(ctx));
    hearts=hearts.filter(h=>h.update());hearts.forEach(h=>h.draw(ctx));
    particles.forEach(p=>p.draw(angleY,pulse));

    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
