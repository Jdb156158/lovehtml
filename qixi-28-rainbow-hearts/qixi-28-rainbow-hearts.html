<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>多彩漂浮爱心 · 七夕</title>
<style>
  html,body{margin:0;height:100%;background:#07030f;overflow:hidden;}
  canvas{display:block;}
  .tip{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#ffc6ec;
       font:14px/1.4 -apple-system,system-ui,sans-serif;opacity:.5;pointer-events:none;}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
       color:#ff5b8a;font:16px/1.6 monospace;padding:20px;text-align:center;white-space:pre-wrap;z-index:9;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tip">一整片彩虹般的心动，缓缓升起</div>
<div id="err"></div>
<script>
window.onerror=function(m){var e=document.getElementById('err');e.style.display='flex';e.textContent='出错了：'+m;};
(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  let W,H,DPR;
  function heartPath(c,s){
    c.beginPath();
    for(let i=0;i<=64;i++){
      const t=i/64*Math.PI*2;
      const x=16*Math.pow(Math.sin(t),3);
      const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      const px=x/16*s, py=-y/16*s;
      if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
    }
    c.closePath();
  }
  let hearts=[];
  function spawn(){
    const s=(16+Math.random()*40)*DPR;
    hearts.push({x:Math.random()*W, y:H+40+s, vy:0.3+Math.random()*0.7,
      s:s, hue:Math.random()*360, rot:Math.random()*6.28, rs:(Math.random()-0.5)*0.02,
      ph:Math.random()*6.28, amp:0.3+Math.random()*0.9, a:0.55+Math.random()*0.4});
  }
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    hearts=[];
    const n=Math.round(W*H/24000);
    for(let i=0;i<n;i++){spawn();hearts[i].y=Math.random()*H;}
  }
  addEventListener('resize',resize); resize();
  let t=0;
  function frame(){
    t+=0.016;
    ctx.globalCompositeOperation='source-over';
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#07030f'); g.addColorStop(1,'#160427');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(let i=hearts.length-1;i>=0;i--){
      const h=hearts[i];
      h.y-=h.vy*DPR; h.rot+=h.rs; h.x+=Math.sin(t*0.6+h.ph)*h.amp*DPR;
      if(h.y< -h.s*1.5){hearts.splice(i,1);continue;}
      const a=h.a*(0.6+0.4*Math.sin(t*1.2+h.ph));
      // soft glow
      ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(h.rot); ctx.scale(h.s*1.7,h.s*1.7);
      ctx.fillStyle='hsla('+h.hue+',100%,65%,'+(a*0.16)+')';
      heartPath(ctx,1); ctx.fill(); ctx.restore();
      // core
      ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(h.rot); ctx.scale(h.s,h.s);
      ctx.fillStyle='hsla('+h.hue+',95%,68%,'+a+')';
      heartPath(ctx,1); ctx.fill(); ctx.restore();
    }
    if(hearts.length<Math.round(W*H/20000)&&Math.random()<0.4) spawn();
    ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
