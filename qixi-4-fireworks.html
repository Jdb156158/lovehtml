<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎆 七夕 · 烟花告白</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#05010f 0%,#1a0533 60%,#2d0a40 100%);
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;cursor:crosshair;}
  #c{display:block;}
  .title{position:fixed;left:0;right:0;top:8%;text-align:center;color:#fff;
    font-size:clamp(20px,4.6vw,30px);letter-spacing:8px;text-shadow:0 0 22px #ff5fa2;
    pointer-events:none;font-weight:300;}
  .tip{position:fixed;left:0;right:0;bottom:26px;text-align:center;color:#ffc2e0;
    font-size:13px;letter-spacing:3px;opacity:.8;pointer-events:none;}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l,c){var d=document.createElement('div');d.style.cssText='position:fixed;left:0;top:0;right:0;padding:10px 14px;background:#c0392b;color:#fff;font:13px/1.5 monospace;z-index:99999;white-space:pre-wrap;word-break:break-all';d.textContent='⚠ 出错: '+m+'  @行'+l+':'+c;document.body.appendChild(d);};</script>

<div class="title">七 夕 烟 火 · 为 你 盛 放</div>
<canvas id="c"></canvas>
<div class="tip">点击任意位置放烟花 · 也可以静静等待</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
resize();addEventListener('resize',resize);

const rockets=[],sparks=[];
const palette=['#ff5e9c','#ffd166','#ff8ec4','#7bdff2','#ff6f91','#fff0a6','#c77dff'];

function launch(tx,ty){
  rockets.push({x:tx,y:H+10,tx,ty:ty||H*0.32+Math.random()*H*0.2,
    vy:-9-Math.random()*3,color:palette[(Math.random()*palette.length)|0]});
}
function explode(x,y,color){
  const n=46;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    const r=Math.random()*0.4+0.6;
    // 沿爱心曲线分布爆炸点
    const hx=16*Math.pow(Math.sin(a),3);
    const hy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));
    const speed=2.4;
    sparks.push({
      x,y,
      vx:hx/16*speed*r,
      vy:hy/16*speed*r,
      life:1,decay:Math.random()*0.012+0.008,
      color:Math.random()<0.5?color:'#ffffff',
      size:Math.random()*2+1.4
    });
  }
}

// 自动放烟花
function auto(){launch(Math.random()*W, H*0.3+Math.random()*H*0.2);}
setInterval(auto,1100);
setTimeout(auto,400);

addEventListener('click',e=>{
  for(let i=0;i<2;i++) launch(e.clientX+(Math.random()-.5)*60, e.clientY);
});

// 背景星
const stars=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H*0.8,
  r:Math.random()*1.3+0.2,tw:Math.random()*Math.PI*2}));

function render(){
  // 拖尾
  ctx.fillStyle='rgba(5,1,15,0.25)';
  ctx.fillRect(0,0,W,H);

  // 星
  for(const s of stars){
    s.tw+=0.05;
    const a=0.4+Math.sin(s.tw)*0.4;
    ctx.beginPath();ctx.fillStyle='rgba(255,255,255,'+a+')';
    ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  }

  ctx.globalCompositeOperation='lighter';
  // 火箭
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.x+=(r.tx-r.x)*0.02; r.y+=r.vy; r.vy+=0.12;
    ctx.beginPath();ctx.fillStyle=r.color;
    ctx.arc(r.x,r.y,2.6,0,7);ctx.fill();
    if(r.y<=r.ty||r.vy>=0){explode(r.x,r.y,r.color);rockets.splice(i,1);}
  }
  // 火花
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.03;p.vx*=0.985;p.vy*=0.985;
    p.life-=p.decay;
    if(p.life<=0){sparks.splice(i,1);continue;}
    ctx.beginPath();
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.arc(p.x,p.y,p.size*p.life+0.4,0,7);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
