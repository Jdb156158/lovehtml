<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>烟花心爆 · 七夕</title>
<style>
  html,body{margin:0;height:100%;background:#03030a;overflow:hidden;}
  canvas{display:block;}
  .tip{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#ffb0e0;
       font:14px/1.4 -apple-system,system-ui,sans-serif;opacity:.5;pointer-events:none;}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
       color:#ff5b8a;font:16px/1.6 monospace;padding:20px;text-align:center;white-space:pre-wrap;z-index:9;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tip">夜空为你放一场烟花</div>
<div id="err"></div>
<script>
window.onerror=function(m){var e=document.getElementById('err');e.style.display='flex';e.textContent='出错了：'+m;};
(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  let W,H,DPR,sc,cx,cy;
  let stars=[];
  function buildStars(){
    stars=[];
    const N=Math.round(W*H/9000);
    for(let i=0;i<N;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.85,
      r:Math.random()*1.3*DPR, ph:Math.random()*6.28, sp:0.5+Math.random()});
  }
  function heartShape(c,s){
    c.beginPath();
    for(let i=0;i<=64;i++){
      const t=i/64*Math.PI*2;
      const x=16*Math.pow(Math.sin(t),3);
      const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      const px=x/16*s, py=-y/16*s;
      if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
    }
    c.closePath();
  }
  let rockets=[], hearts=[];
  function launch(){
    const tx=W*(0.2+Math.random()*0.6);
    const ty=H*(0.18+Math.random()*0.32);
    rockets.push({x:tx+(Math.random()*2-1)*W*0.05, y:H+10, ty:ty, h:300+Math.random()*60});
  }
  function explode(x,y,h){
    const s=sc*(0.35+Math.random()*0.5);
    const N=150;
    const parts=[];
    for(let i=0;i<N;i++){
      const t=Math.random()*Math.PI*2;
      const u=Math.sqrt(Math.random());
      const X=16*Math.pow(Math.sin(t),3);
      const Y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      parts.push({nx:X/16*u, ny:Y/16*u});
    }
    hearts.push({x:x,y:y,s:s,parts:parts,h:h,life:1});
  }
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    sc=Math.min(W/2.4,H/2.6);
    cx=W/2; cy=H/2;
    buildStars();
  }
  addEventListener('resize',resize);
  resize();
  let t=0, acc=0;
  function frame(){
    t+=0.016; acc+=0.016;
    // trail fade
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(3,3,10,0.28)';
    ctx.fillRect(0,0,W,H);

    // stars
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<stars.length;i++){
      const s=stars[i];
      const a=0.3+0.5*Math.abs(Math.sin(t*s.sp+s.ph));
      ctx.beginPath();
      ctx.fillStyle='rgba(255,220,245,'+a+')';
      ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
    }

    // launch
    if(acc>0.7){acc=0; if(Math.random()<0.85) launch();}
    for(let i=rockets.length-1;i>=0;i--){
      const r=rockets[i];
      r.y-=(r.y-r.ty)*0.05+2*DPR;
      ctx.beginPath();
      ctx.fillStyle='hsla('+r.h+',100%,80%,0.95)';
      ctx.arc(r.x,r.y,1.6*DPR,0,6.283); ctx.fill();
      if(r.y<=r.ty){ explode(r.x,r.y,r.h); rockets.splice(i,1); }
    }

    // heart fireworks
    for(let i=hearts.length-1;i>=0;i--){
      const hb=hearts[i];
      hb.life-=0.007;
      if(hb.life<=0){hearts.splice(i,1);continue;}
      const sc2=hb.s*(1+(1-hb.life)*0.25);
      for(let j=0;j<hb.parts.length;j++){
        const p=hb.parts[j];
        const a=hb.life*0.9;
        ctx.beginPath();
        ctx.fillStyle='hsla('+hb.h+',100%,'+(60+hb.life*25)+'%,'+a+')';
        ctx.arc(hb.x+p.nx*sc2, hb.y-p.ny*sc2, 1.5*DPR, 0, 6.283);
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
