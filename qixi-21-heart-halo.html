<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>心跳光环 · 七夕</title>
<style>
  html,body{margin:0;height:100%;background:#05030a;overflow:hidden;}
  canvas{display:block;}
  .tip{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#ff9ad5;
       font:14px/1.4 -apple-system,system-ui,sans-serif;opacity:.5;pointer-events:none;}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
       color:#ff5b8a;font:16px/1.6 monospace;padding:20px;text-align:center;white-space:pre-wrap;z-index:9;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tip">为你跳动 · 点击屏幕绽放</div>
<div id="err"></div>
<script>
window.onerror=function(m){var e=document.getElementById('err');e.style.display='flex';e.textContent='出错了：'+m;};
(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  let W,H,DPR,sc,cx,cy;
  function heartShape(c,s){
    c.beginPath();
    for(let i=0;i<=64;i++){
      const t=i/64*Math.PI*2;
      const x=16*Math.pow(Math.sin(t),3);
      const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      const px=x/16*s, py=-y/16*s;
      if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
    }
    c.closePath();
  }
  let shimmer=[];
  function buildShimmer(){
    shimmer=[];
    const N=520;
    for(let i=0;i<N;i++){
      const t=Math.random()*Math.PI*2;
      const u=Math.sqrt(Math.random());
      const x=16*Math.pow(Math.sin(t),3);
      const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      shimmer.push({nx:x/16*u, ny:y/16*u, h:305+Math.random()*45, ph:Math.random()*6.28});
    }
  }
  const RING=460;
  let ring=[];
  function buildRing(){
    ring=[];
    for(let i=0;i<RING;i++){
      ring.push({a:Math.random()*6.28, r:0.96+Math.random()*0.12,
                 sp:0.0016+Math.random()*0.004, sz:1+Math.random()*1.8, h:300+Math.random()*55});
    }
  }
  let rise=[];
  function spawnRise(){
    rise.push({x:cx+(Math.random()*2-1)*sc*1.3, y:H+20, vy:0.5+Math.random()*0.9,
               s:(10+Math.random()*20)*DPR, h:318+Math.random()*45, ph:Math.random()*6.28});
  }
  let bursts=[];
  function burst(bx,by){
    for(let i=0;i<70;i++){
      const a=Math.random()*6.28, sp=2+Math.random()*5;
      bursts.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,h:320+Math.random()*50,sz:(1+Math.random()*2.6)*DPR});
    }
  }
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    sc=Math.min(W/2.7,H/2.9);
    cx=W/2; cy=H/2+sc*0.12;
    buildShimmer(); buildRing();
  }
  addEventListener('resize',resize);
  cv.addEventListener('pointerdown',e=>{burst(e.clientX*DPR,e.clientY*DPR);});
  let t=0;
  function frame(){
    t+=0.016;
    const beat=1+0.05*Math.sin(t*2.1)+0.03*Math.sin(t*4.3);
    const s=sc*beat;
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#05030a'; ctx.fillRect(0,0,W,H);

    // solid heart body
    ctx.save();
    ctx.translate(cx,cy);
    const g=ctx.createRadialGradient(0,-s*0.2,s*0.1,0,0,s*1.15);
    g.addColorStop(0,'rgba(255,150,210,0.95)');
    g.addColorStop(0.55,'rgba(255,80,170,0.92)');
    g.addColorStop(1,'rgba(150,30,120,0.9)');
    ctx.fillStyle=g;
    heartShape(ctx,s);
    ctx.fill();
    ctx.restore();

    // shimmer
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<shimmer.length;i++){
      const p=shimmer[i];
      const a=0.35+0.6*Math.abs(Math.sin(t*1.6+p.ph));
      ctx.beginPath();
      ctx.fillStyle='hsla('+p.h+',100%,78%,'+a+')';
      ctx.arc(cx+p.nx*s, cy-p.ny*s, 1.5*DPR, 0, 6.283);
      ctx.fill();
    }
    // ring
    for(let i=0;i<ring.length;i++){
      const p=ring[i]; p.a+=p.sp;
      const r=sc*1.55*p.r;
      ctx.beginPath();
      ctx.fillStyle='hsla('+p.h+',100%,72%,0.9)';
      ctx.arc(cx+Math.cos(p.a)*r, cy+Math.sin(p.a)*r*0.92, p.sz*DPR, 0, 6.283);
      ctx.fill();
    }
    // rising hearts
    if(Math.random()<0.05) spawnRise();
    for(let i=rise.length-1;i>=0;i--){
      const p=rise[i];
      p.y-=p.vy*DPR; p.x+=Math.sin(t+p.ph)*0.4*DPR;
      if(p.y< -40){rise.splice(i,1);continue;}
      ctx.save();
      ctx.translate(p.x,p.y); ctx.scale(p.s,p.s);
      ctx.fillStyle='hsla('+p.h+',100%,74%,0.8)';
      heartShape(ctx,1); ctx.fill();
      ctx.restore();
    }
    // bursts
    for(let i=bursts.length-1;i>=0;i--){
      const p=bursts[i];
      p.x+=p.vx*DPR; p.y+=p.vy*DPR; p.vy+=0.08*DPR; p.life-=0.012;
      if(p.life<=0){bursts.splice(i,1);continue;}
      ctx.beginPath();
      ctx.fillStyle='hsla('+p.h+',100%,78%,'+p.life+')';
      ctx.arc(p.x,p.y,p.sz*DPR,0,6.283);
      ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
