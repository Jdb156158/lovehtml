<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>♥ 星河入心</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070310;}
  canvas{display:block;}
  #hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;
    color:rgba(255,200,235,.5);font:14px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif;
    letter-spacing:2px;pointer-events:none;text-shadow:0 0 12px rgba(255,120,190,.4);}
  #err{position:fixed;top:0;left:0;right:0;padding:10px 14px;background:rgba(180,0,40,.92);
    color:#fff;font:13px/1.4 monospace;white-space:pre-wrap;display:none;z-index:9;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">移动鼠标，星河为你让路 ♥</div>
<div id="err"></div>
<script>
window.onerror=function(m,s,l){var d=document.getElementById('err');if(d){d.style.display='block';d.textContent='⚠️ 出错了：'+m+' @行'+(l||'?');}};

var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W,H,DPR,cx,cy,unit,bgGrad,pts=[],stars=[];
var mouse={x:-9999,y:-9999};
var R=26; // 连线距离阈值

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2; cy=H*0.52;
  unit=Math.min(W*0.66/2.7, H*0.60/2.7);
  bgGrad=ctx.createRadialGradient(cx,cy*0.85,0,cx,cy,Math.max(W,H)*0.8);
  bgGrad.addColorStop(0,'#160a2b');
  bgGrad.addColorStop(0.55,'#0c0520');
  bgGrad.addColorStop(1,'#05020c');
  stars=[];
  var n=Math.round(W*H/8000);
  for(var i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*1.3+0.3,ph:Math.random()*6.28,sp:Math.random()*0.6+0.2,vy:Math.random()*0.16+0.03});
}

// 经典心形不等式 (x²+y²-1)³ - x²y³ < 0 为内部
function buildHeart(){
  pts=[];
  var step=0.105;
  for(var X=-1.4;X<=1.4;X+=step){
    for(var Y=-1.4;Y<=1.4;Y+=step){
      var f=Math.pow(X*X+Y*Y-1,3)-X*X*Y*Y*Y;
      if(f<0){
        pts.push({bx:X,by:Y,ox:Math.random()*6.28,oy:Math.random()*6.28,
          amp:Math.random()*0.03+0.015,hue:300+Math.random()*45});
      }
    }
  }
}

function beat(t){
  var p=(t%1.2)/1.2;
  var s=Math.exp(-Math.pow((p-0.10)/0.05,2))+0.5*Math.exp(-Math.pow((p-0.28)/0.06,2));
  return 1+0.05*s;
}

function drawStars(t){
  for(var i=0;i<stars.length;i++){
    var s=stars[i]; s.y-=s.vy; if(s.y<-2){s.y=H+2;s.x=Math.random()*W;}
    var a=0.3+0.4*(0.5+0.5*Math.sin(t*s.sp+s.ph));
    ctx.beginPath(); ctx.fillStyle='rgba(255,225,245,'+a.toFixed(3)+')';
    ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
  }
}

var t0=performance.now();
function frame(now){
  var t=(now-t0)/1000;
  ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);
  drawStars(t);
  var sc=beat(t);
  var pos=[];
  for(var i=0;i<pts.length;i++){
    var p=pts[i];
    var dx=(Math.sin(t*0.7+p.ox)*p.amp);
    var dy=(Math.cos(t*0.7+p.oy)*p.amp);
    var px=cx+(p.bx+dx)*unit*sc;
    var py=cy-(p.by+dy)*unit*sc;
    // 鼠标让路
    var mdx=px-mouse.x, mdy=py-mouse.y, md=Math.sqrt(mdx*mdx+mdy*mdy);
    if(md<95 && md>0.01){ var f=(95-md)/95*16; px+=mdx/md*f; py+=mdy/md*f; }
    pos.push([px,py,p.hue]);
  }
  // 连线
  ctx.lineWidth=1;
  for(var i=0;i<pos.length;i++){
    var a=pos[i];
    for(var j=i+1;j<pos.length;j++){
      var b=pos[j];
      var ddx=a[0]-b[0], ddy=a[1]-b[1], d2=ddx*ddx+ddy*ddy;
      if(d2<R*R){
        var al=(1-Math.sqrt(d2)/R)*0.42;
        ctx.beginPath();
        ctx.strokeStyle='rgba(255,130,205,'+al.toFixed(3)+')';
        ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
      }
    }
  }
  // 点
  for(var i=0;i<pos.length;i++){
    ctx.beginPath();
    ctx.fillStyle='hsla('+pos[i][2]+',100%,72%,0.9)';
    ctx.arc(pos[i][0],pos[i][1],1.6,0,6.283); ctx.fill();
  }
  requestAnimationFrame(frame);
}

canvas.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
canvas.addEventListener('mouseleave',function(){mouse.x=-9999;mouse.y=-9999;});
canvas.addEventListener('touchmove',function(e){if(e.touches[0]){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY;}},{passive:true});

resize(); buildHeart();
window.addEventListener('resize',function(){resize();});
requestAnimationFrame(frame);
</script>
</body>
</html>
