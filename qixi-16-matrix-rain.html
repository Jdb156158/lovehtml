<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矩阵爱心雨 七夕</title>
<style>
  *{margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#02010a;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #rain{z-index:1;}
  #heart{z-index:2;}
  .cap{position:fixed;left:0;right:0;bottom:26px;text-align:center;z-index:3;
    font:600 15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;
    color:rgba(255,225,240,.6);letter-spacing:3px;pointer-events:none;
    text-shadow:0 0 12px rgba(255,120,180,.6);}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<canvas id="heart"></canvas>
<div class="cap">I LOVE YOU · 七 夕 快 乐</div>
<script>
window.onerror=function(m,s,l,c){var d=document.createElement('div');d.style.cssText='position:fixed;left:0;top:0;right:0;padding:10px 14px;background:#c0392b;color:#fff;font:13px/1.5 monospace;z-index:99999;white-space:pre-wrap;word-break:break-all';d.textContent='⚠ 出错: '+m+'  @行'+l+':'+c;document.body.appendChild(d);};

/* ===== 矩阵字符雨（底层）===== */
const rc=document.getElementById('rain'),rx=rc.getContext('2d');
let RW,RH,cols,drops,FS=18;
const CHARS='I LOVE YOU 七夕快乐 想你 ♥ 1314'.split('');
function rresize(){RW=rc.width=innerWidth;RH=rc.height=innerHeight;cols=Math.floor(RW/FS);drops=Array(cols).fill(0).map(()=>Math.random()*-RH/FS);}
addEventListener('resize',rresize);rresize();
function rain(){
  requestAnimationFrame(rain);
  rx.fillStyle='rgba(2,1,10,0.12)';rx.fillRect(0,0,RW,RH);
  rx.font=FS+'px "PingFang SC",monospace';
  for(let i=0;i<cols;i++){
    const ch=CHARS[Math.floor(Math.random()*CHARS.length)];
    const x=i*FS, y=drops[i]*FS;
    rx.fillStyle='rgba(255,210,235,0.95)';rx.fillText(ch,x,y);
    rx.fillStyle='rgba(255,120,180,0.35)';rx.fillText(ch,x,y-FS);
    if(y>RH&&Math.random()>0.975)drops[i]=0;
    drops[i]+=0.6+Math.random()*0.5;
  }
}
rain();

/* ===== 发光粒子爱心（上层）===== */
const hc=document.getElementById('heart'),hx=hc.getContext('2d');
let HW,HH;
function hresize(){HW=hc.width=innerWidth;HH=hc.height=innerHeight;}
addEventListener('resize',hresize);hresize();

const HS=()=>Math.min(HW,HH)*0.014;
function inside(x,y){const nx=x/16,ny=-y/16,x2=nx*nx,y2=ny*ny;return Math.pow(x2+y2-1,3)-x2*ny*ny*ny<=0;}
function rpt(){let px,py;do{px=(Math.random()*2-1)*17;py=(Math.random()*2-1)*18-2;}while(!inside(px,py));const s=HS();return{x:px*s,y:py*s};}

const M=1300;
const ps=Array.from({length:M},()=>{const p=rpt();return{x:p.x,y:p.y,tx:p.x,ty:p.y,ph:Math.random()*6.28,sp:0.004+Math.random()*0.01,r:2+Math.random()*4,d:Math.random()};});
let t=0;
function heart(){
  requestAnimationFrame(heart);
  t+=0.02;
  hx.clearRect(0,0,HW,HH);
  hx.globalCompositeOperation='lighter';
  const s=HS();
  const g=hx.createRadialGradient(HW/2,HH/2,s*4,HW/2,HH/2,s*22);
  g.addColorStop(0,'rgba(255,140,190,0.10)');
  g.addColorStop(0.5,'rgba(214,80,140,0.04)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  hx.fillStyle=g;hx.beginPath();hx.arc(HW/2,HH/2,s*22,0,6.29);hx.fill();

  const pulse=1+Math.sin(t*0.6)*0.07;
  hx.save();hx.translate(HW/2,HH/2);
  for(const p of ps){
    p.ph+=p.sp;
    const gx=p.tx*pulse+Math.cos(p.ph)*p.r, gy=p.ty*pulse+Math.sin(p.ph)*p.r;
    p.x+=(gx-p.x)*0.08;p.y+=(gy-p.y)*0.08;
    const m=p.d;
    const r=(255+(214-255)*m)|0, g2=(140+(80-140)*m)|0, b=(190+(140-190)*m)|0;
    hx.fillStyle='rgba('+r+','+g2+','+b+',0.85)';
    hx.beginPath();hx.arc(p.x,p.y,1.4+p.r*0.25,0,6.29);hx.fill();
  }
  hx.restore();
  hx.globalCompositeOperation='source-over';
}
heart();
</script>
</body>
</html>
