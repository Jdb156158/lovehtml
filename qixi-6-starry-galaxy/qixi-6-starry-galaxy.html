<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 七夕 · 星河入梦</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#02000c;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  #c{display:block;}
  .title{position:fixed;left:0;right:0;top:7%;text-align:center;color:#fff;
    font-size:clamp(20px,4.6vw,30px);letter-spacing:10px;text-shadow:0 0 22px #9bd0ff;
    pointer-events:none;font-weight:300;}
  .sub{position:fixed;left:0;right:0;top:calc(7% + 50px);text-align:center;color:#bcdcff;
    font-size:13px;letter-spacing:4px;opacity:.8;pointer-events:none;}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l,c){var d=document.createElement('div');d.style.cssText='position:fixed;left:0;top:0;right:0;padding:10px 14px;background:#c0392b;color:#fff;font:13px/1.5 monospace;z-index:99999;white-space:pre-wrap;word-break:break-all';d.textContent='⚠ 出错: '+m+'  @行'+l+':'+c;document.body.appendChild(d);};</script>

<div class="title">七 夕 · 星 河 入 梦</div>
<div class="sub">银河迢迢，不及你眼里的光</div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
resize();addEventListener('resize',resize);

// 星点
const stars=Array.from({length:260},()=>({
  x:Math.random()*W,y:Math.random()*H,
  r:Math.random()*1.4+0.2,tw:Math.random()*6.28,
  sp:Math.random()*0.04+0.01,
  hue:Math.random()<0.3?'#ffd6ec':(Math.random()<0.5?'#bcdcff':'#ffffff')
}));

// 爱心上的点（隐函数）
const pts=[];
(function(){
  for(let i=0;i<420;i++){
    const x=(Math.random()*2-1)*1.3, y=(Math.random()*2-1)*1.3;
    const a=x*x+y*y-1;
    if(a*a*a-x*x*y*y*y<=0) pts.push({x,y});
  }
})();
const heartStars=pts.map(p=>({nx:p.x,ny:p.y,tw:Math.random()*6.28,base:Math.random()*1.2+0.6}));

// 流星
const meteors=[];
function spawnMeteor(){
  meteors.push({x:Math.random()*W*0.7,y:-20,len:Math.random()*120+80,
    vx:Math.random()*3+4,vy:Math.random()*2+3,life:1});
}
setInterval(()=>{if(Math.random()<0.7)spawnMeteor();},2600);

let t=0;
function render(){
  t+=0.016;
  // 银河背景
  ctx.fillStyle='#02000c';ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'rgba(40,20,80,0.35)');
  g.addColorStop(.5,'rgba(10,5,40,0.1)');
  g.addColorStop(1,'rgba(60,20,90,0.3)');
  ctx.fillStyle=g;ctx.fillRect(0,H*0.35,W,H*0.3);

  // 普通星
  for(const s of stars){
    s.tw+=s.sp;
    const a=0.35+Math.sin(s.tw)*0.4;
    ctx.beginPath();ctx.fillStyle=s.hue;
    ctx.globalAlpha=a;ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  // 爱心星
  const cx=W/2,cy=H/2+10,scale=Math.min(W,H)/3.1;
  ctx.globalCompositeOperation='lighter';
  for(const h of heartStars){
    const x=cx+h.nx*scale, y=cy-h.ny*scale;
    h.tw+=0.05;
    const tw=0.5+Math.sin(h.tw)*0.5;
    ctx.beginPath();
      ctx.fillStyle='rgba(255,200,235,'+(0.5+tw*0.5)+')';
      ctx.arc(x,y,h.base*(0.7+tw*0.6),0,7);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  // 月亮
  ctx.beginPath();
  ctx.fillStyle='rgba(255,245,220,0.95)';
  ctx.shadowColor='#fff';ctx.shadowBlur=30;
  ctx.arc(W*0.82,H*0.2,Math.min(W,H)*0.05,0,7);ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath();ctx.fillStyle='#02000c';
  ctx.arc(W*0.80,H*0.18,Math.min(W,H)*0.05,0,7);ctx.fill();

  // 流星
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.x+=m.vx;m.y+=m.vy;m.life-=0.012;
    if(m.life<=0||m.x>W+50||m.y>H+50){meteors.splice(i,1);continue;}
    const tx=m.x-m.vx/m.vy*m.len, ty=m.y-m.len;
    const grad=ctx.createLinearGradient(m.x,m.y,tx,ty);
    grad.addColorStop(0,'rgba(255,255,255,'+m.life+')');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=grad;ctx.lineWidth=2.2;
    ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke();
  }
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
