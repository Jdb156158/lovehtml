<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Animation · qixi-19</title>
<script>
window.onerror=function(m,s,l){var d=document.getElementById('err');if(!d){d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#c00;color:#fff;font:13px/1.5 monospace;padding:8px 12px;white-space:pre-wrap';document.body.appendChild(d);}d.textContent='⚠ 运行错误：'+(m||'')+' @行'+(l||'');};
</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a0010 0%,#0a0008 70%,#050004 100%);}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%;background-color:transparent;}
  #love-message{
    position:absolute;top:8%;left:50%;transform:translateX(-50%);
    font-size:clamp(2.2rem,7vw,4rem);
    font-family:'Snell Roundhand','Apple Chancery','Brush Script MT',cursive;
    letter-spacing:6px;font-style:italic;text-align:center;z-index:1;white-space:nowrap;
  }
  #love-message span{display:inline-block;animation:jump 3s infinite,colorChange 3s infinite;}
  @keyframes jump{0%{transform:translateY(0)}50%{transform:translateY(-18px)}100%{transform:translateY(0)}}
  @keyframes colorChange{0%{color:#FF69BE}50%{color:#FF2D55}100%{color:#FF69BE}}
  #love-message span:nth-child(1){animation-delay:0s}
  #love-message span:nth-child(2){animation-delay:.08s}
  #love-message span:nth-child(3){animation-delay:.16s}
  #love-message span:nth-child(4){animation-delay:.24s}
  #love-message span:nth-child(5){animation-delay:.32s}
  #love-message span:nth-child(6){animation-delay:.40s}
  #love-message span:nth-child(7){animation-delay:.48s}
  #love-message span:nth-child(8){animation-delay:.56s}
  #love-message span:nth-child(9){animation-delay:.64s}
  #love-message span:nth-child(10){animation-delay:.72s}
  #love-message span:nth-child(11){animation-delay:.80s}
  #copy{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:1rem;color:#ff005ed7;animation:colorChange 4s infinite;font-family:system-ui,sans-serif;}
</style>
</head>
<body>
  <div id="love-message"><span>I</span><span>&nbsp;</span><span>l</span><span>o</span><span>v</span><span>e</span><span>&nbsp;</span><span>y</span><span>o</span><span>u</span></div>
  <canvas id="heart"></canvas>
  <div id="copy">七夕快乐 · 双击即开</div>
<script>
(function(){
  const raf = window.requestAnimationFrame || function(cb){return setTimeout(function(){cb(Date.now());},16);};
  const isDevice = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test((navigator.userAgent||'').toLowerCase());
  let loaded=false;
  function init(){
    if(loaded)return; loaded=true;
    const mobile=isDevice;
    const koef=mobile?0.5:1;
    const canvas=document.getElementById('heart');
    const ctx=canvas.getContext('2d');
    const rand=Math.random;
    const baseWidth=1920, baseHeight=1080;
    function updateCanvasSize(){
      const width=canvas.width=koef*innerWidth;
      const height=canvas.height=koef*innerHeight;
      const scale=Math.min(width/baseWidth,height/baseHeight);
      ctx.fillStyle='rgba(0,0,0,1)'; ctx.fillRect(0,0,width,height);
      return {width,height,scale};
    }
    let {width,height,scale}=updateCanvasSize();
    function heartPosition(rad){
      return [Math.pow(Math.sin(rad),3),-(15*Math.cos(rad)-5*Math.cos(2*rad)-2*Math.cos(3*rad)-Math.cos(4*rad))];
    }
    function scaleAndTranslate(pos,sx,sy,dx,dy){return [dx+pos[0]*sx,dy+pos[1]*sy];}
    function updatePointsOrigin(){
      const pointsOrigin=[]; const dr=mobile?0.3:0.1;
      for(let i=0;i<Math.PI*2;i+=dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i),372*scale,23*scale,0,0));
      for(let i=0;i<Math.PI*2;i+=dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i),300*scale,18*scale,0,0));
      for(let i=0;i<Math.PI*2;i+=dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i),228*scale,13*scale,0,0));
      return pointsOrigin;
    }
    let pointsOrigin=updatePointsOrigin();
    let heartPointsCount=pointsOrigin.length;
    let targetPoints=[];
    function pulse(kx,ky){
      for(let i=0;i<pointsOrigin.length;i++){
        targetPoints[i]=[kx*pointsOrigin[i][0]+width/2, ky*pointsOrigin[i][1]+height/2.2];
      }
    }
    window.addEventListener('resize',function(){
      const size=updateCanvasSize(); width=size.width; height=size.height; scale=size.scale;
      pointsOrigin=updatePointsOrigin(); heartPointsCount=pointsOrigin.length;
    });
    const traceCount=mobile?20:50;
    const e=[];
    for(let i=0;i<heartPointsCount;i++){
      const x=rand()*width, y=rand()*height;
      e[i]={vx:0,vy:0,R:2*scale,speed:(rand()+5)*scale,q:~~(rand()*heartPointsCount),D:2*(i%2)-1,force:0.2*rand()+0.7,trace:Array.from({length:traceCount},()=>({x,y}))};
    }
    const glowingHearts=[];
    function createGlowingHeart(){
      return {x:rand()*width,y:height+20*scale,vy:-(rand()*4+2)*scale,size:(rand()*15+10)*scale,opacity:1,color:interpolateColor(rand())};
    }
    const config={traceK:0.4,timeDelta:0.6};
    let time=0,colorTime=0,colorDuration=2,textOpacity=0,showText=false,heartsPassed=0;
    function interpolateColor(t){
      const startColor={r:255,g:105,b:190}, endColor={r:255,g:0,b:0};
      let r,g,b;
      if(t<0.5){r=Math.round(startColor.r+(endColor.r-startColor.r)*(t*2));g=Math.round(startColor.g+(endColor.g-startColor.g)*(t*2));b=Math.round(startColor.b+(endColor.b-startColor.b)*(t*2));}
      else{t=(t-0.5)*2;r=Math.round(endColor.r+(startColor.r-endColor.r)*t);g=Math.round(endColor.g+(startColor.g-endColor.g)*t);b=Math.round(endColor.b+(startColor.b-endColor.b)*t);}
      return 'rgba('+r+','+g+','+b+',';
    }
    function loop(){
      const n=-Math.cos(time);
      pulse((1+n)*0.5,(1+n)*0.5);
      time+=(Math.sin(time)<0?9:n>0.8?0.2:1)*config.timeDelta;
      ctx.fillStyle='rgba(0,0,0,.1)'; ctx.fillRect(0,0,width,height);
      colorTime+=0.016;
      const t=(colorTime%colorDuration)/colorDuration;
      const currentColor=interpolateColor(t);
      for(let i=e.length;i--;){
        const u=e[i], q=targetPoints[u.q];
        const dx=u.trace[0].x-q[0], dy=u.trace[0].y-q[1];
        const length=Math.sqrt(dx*dx+dy*dy);
        if(length<10*scale){
          if(rand()>0.95) u.q=~~(rand()*heartPointsCount);
          else { if(rand()>0.99) u.D*=-1; u.q=(u.q+u.D)%heartPointsCount; if(u.q<0) u.q+=heartPointsCount; }
        }
        u.vx+=(-dx/length)*u.speed; u.vy+=(-dy/length)*u.speed;
        u.trace[0].x+=u.vx; u.trace[0].y+=u.vy; u.vx*=u.force; u.vy*=u.force;
        for(let k=0;k<u.trace.length-1;k++){
          const T=u.trace[k], N=u.trace[k+1];
          N.x-=config.traceK*(N.x-T.x); N.y-=config.traceK*(N.y-T.y);
        }
        ctx.fillStyle=currentColor+'0.7)';
        u.trace.forEach(p=>ctx.fillRect(p.x,p.y,2*scale,2*scale));
      }
      if(rand()>0.7) glowingHearts.push(createGlowingHeart());
      for(let i=glowingHearts.length-1;i>=0;i--){
        const h=glowingHearts[i];
        h.y+=h.vy; h.opacity-=0.01;
        const gradient=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.size);
        gradient.addColorStop(0,h.color+h.opacity+')');
        gradient.addColorStop(1,h.color+'0)');
        ctx.fillStyle=gradient;
        ctx.beginPath();
        for(let rad=0;rad<Math.PI*2;rad+=0.1){
          const [hx,hy]=heartPosition(rad);
          const [x,y]=scaleAndTranslate([hx,hy],h.size/2,h.size/2,h.x,h.y);
          if(rad===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.closePath(); ctx.fill();
        if(h.y<-h.size){heartsPassed++; if(heartsPassed>=5) showText=true; glowingHearts.splice(i,1);}
        else if(h.opacity<=0) glowingHearts.splice(i,1);
      }
      if(showText){textOpacity=Math.min(textOpacity+0.05,1);}
      raf(loop);
    }
    loop();
  }
  const s=document.readyState;
  if(s==='complete'||s==='loaded'||s==='interactive') init();
  else document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
